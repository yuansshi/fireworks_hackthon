[project]
name = "phish-guard"
version = "0.1.0"
description = "Multi-channel phishing/scam detection: fine-tuned Nemotron LoRA vs frontier baselines on Fireworks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=1.50",
  "datasets>=3.0",
  "huggingface_hub",
  "pandas",
  "numpy",
  "pyarrow",
  "scikit-learn",
  "scipy",
  "tldextract",
  "tqdm",
  "matplotlib",
  "pyyaml",
  "python-dotenv",
  "httpx>=0.28.1",
  "truststore>=0.10.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phish"]
